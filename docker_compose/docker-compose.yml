# Docker Compose for CanchaLibre local development
services:
  postgres:
    image: postgres:16-alpine
    container_name: canchalibre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-canchalibre_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-canchalibre_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canchalibre-network

networks:
  canchalibre-network:
    driver: bridge
