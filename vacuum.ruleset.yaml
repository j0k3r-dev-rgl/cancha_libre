# Lint gate for the OpenAPI 3.1 contract required by block T0 of
# docs/roadmap-backend.md.
#
# Gate command, from the repository root, with the API serving the spec:
#
#   mise exec -- vacuum lint -r vacuum.ruleset.yaml --fail-severity error --min-score 98 <spec-file-or-url>
#
# Exit code 0 and a quality score of at least 98 are required before an endpoint
# may be considered documented. The score floor is what makes the silences below
# load-bearing: with the recommended ruleset and no silences the same spec scores
# below the floor, which fails the gate. The rules silenced below are the only
# ones, and each silence carries its justification. Anything else the recommended
# ruleset reports is a finding to fix, not to ignore. `oas3-missing-example` is
# deliberately NOT silenced: the project owns its RFC 7807 error model and every
# documented response carries a per-error example, so the rule is enforced.

extends: [[vacuum:oas, recommended]]

rules:
  # `$schema` is a JSON Schema keyword, not an object property, so camelCase does
  # not apply to it. huma's schema link transformer declares it, and the project
  # keeps that transformer by decision; see
  # .agents/skills/api-contracts-openapi/SKILL.md.
  camel-case-properties: off

  # huma emits the same description for every response that reuses a response
  # type. Those descriptions are correct; the repetition is produced by the
  # toolchain, not authored by us.
  description-duplication: off

  # ErrorModel and ErrorDetail are huma's built-in RFC 7807 schemas. We describe
  # our own DTOs (and the contract tests enforce it); we cannot describe the
  # library's.
  component-description: off

  # ErrorDetail.value is an untyped `any` field inside huma's error model.
  oas-missing-type: off
